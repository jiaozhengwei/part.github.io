<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>配件盘点助手 - 云端扫码盘点</title>
    <!-- 引入需要的库 -->
    <!-- Firebase SDK (云端存储) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- 扫码库 html5-qrcode，优化手机摄像头调用 -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- SheetJS 导出Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
            background: #f1f5f9;
            padding: 16px 12px 24px 12px;
            color: #0f172a;
        }

        /* 整体容器 */
        .app-container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* 头部 */
        .header {
            text-align: center;
            margin-bottom: 18px;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1e3c72, #2b4c7c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .header p {
            color: #475569;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        /* 摄像头卡片区域 */
        .scanner-card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            padding: 16px;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        .scanner-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1e293b;
        }
        .scanner-title span {
            background: #eef2ff;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #2563eb;
        }
        #qr-reader {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
        }
        #qr-reader video {
            border-radius: 20px;
            width: 100%;
            object-fit: cover;
        }
        .scanner-controls {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            justify-content: center;
        }
        .btn-icon {
            background: #f1f5f9;
            border: none;
            padding: 10px 16px;
            border-radius: 48px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #334155;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-icon:active {
            transform: scale(0.96);
            background: #e2e8f0;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
            box-shadow: 0 2px 6px rgba(37,99,235,0.2);
        }
        .btn-primary:active {
            background: #1d4ed8;
        }
        .btn-outline {
            border: 1px solid #cbd5e1;
            background: white;
        }

        /* 手动输入辅助 */
        .manual-section {
            background: #f8fafc;
            border-radius: 20px;
            padding: 12px 14px;
            margin-top: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .manual-section input {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            padding: 10px 14px;
            font-size: 0.85rem;
            background: white;
            font-family: monospace;
        }
        .manual-section button {
            background: #3b82f6;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            cursor: pointer;
        }

        /* 统计栏 */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 12px 18px;
            border-radius: 60px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            align-items: baseline;
        }
        .stats-count {
            font-weight: 700;
            font-size: 1.3rem;
            color: #0f172a;
        }
        .stats-label {
            font-size: 0.75rem;
            color: #5b6e8c;
        }
        .export-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.8rem;
        }

        /* 盘点清单列表 */
        .list-container {
            background: white;
            border-radius: 28px;
            padding: 12px 8px 20px 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1.5px solid #eef2ff;
            font-weight: 600;
            color: #334155;
            font-size: 0.85rem;
        }
        .list-items {
            max-height: 380px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .inventory-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 10px;
            border-bottom: 1px solid #f0f2f5;
            font-size: 0.8rem;
            transition: background 0.1s;
        }
        .item-code {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.75rem;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 12px;
            word-break: break-all;
            max-width: 55%;
            color: #0c4e6e;
            font-weight: 500;
        }
        .item-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        .item-time {
            font-size: 0.7rem;
            color: #6c86a3;
        }
        .item-status {
            background: #dcfce7;
            color: #15803d;
            padding: 2px 8px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .delete-item {
            background: transparent;
            border: none;
            font-size: 1.3rem;
            color: #94a3b8;
            cursor: pointer;
            padding: 0 8px;
            margin-left: 8px;
        }
        .empty-list {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .clear-all {
            margin-top: 12px;
            display: flex;
            justify-content: flex-end;
        }
        .btn-clear {
            background: #fee2e2;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: #b91c1c;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293bc9;
            backdrop-filter: blur(12px);
            color: white;
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 0.85rem;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #6c86a3;
            margin-top: 10px;
        }
        button {
            cursor: pointer;
        }
        @media (max-width: 500px) {
            body {
                padding: 12px 10px 20px 10px;
            }
            .item-code {
                max-width: 50%;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1>📦 配件盘点工具</h1>
        <p>扫描二维码 · 确认在库 · 云端同步</p>
    </div>

    <!-- 扫描模块 -->
    <div class="scanner-card">
        <div class="scanner-title">
            📷 扫描确认配件 <span>自动对焦</span>
        </div>
        <div id="qr-reader"></div>
        <div class="scanner-controls">
            <button id="switchCameraBtn" class="btn-icon">🔄 切换摄像头</button>
            <button id="restartScanBtn" class="btn-icon">⟳ 重启扫描</button>
        </div>
        <!-- 手动输入备用，提升体验 -->
        <div class="manual-section">
            <input type="text" id="manualCodeInput" placeholder="或手动输入/粘贴配件码" autocomplete="off">
            <button id="manualAddBtn">➕ 确认在库</button>
        </div>
        <div style="font-size: 0.7rem; color: #5b6e8c; margin-top: 8px; text-align: center;">
            提示：扫描后自动记录「在库」状态，重复扫描会更新时间
        </div>
    </div>

    <!-- 统计 & 导出 -->
    <div class="stats-bar">
        <div><span class="stats-count" id="totalCount">0</span> <span class="stats-label">项配件已盘点</span></div>
        <button id="exportExcelBtn" class="export-btn">📎 导出Excel</button>
    </div>

    <!-- 盘点清单 -->
    <div class="list-container">
        <div class="list-header">
            <span>📋 配件在库清单</span>
            <span>状态</span>
        </div>
        <div id="inventoryList" class="list-items">
            <div class="empty-list">暂无盘点记录，请扫码添加配件 ✅</div>
        </div>
        <div class="clear-all">
            <button id="clearAllBtn" class="btn-clear">🗑️ 清空所有盘点数据</button>
        </div>
    </div>
    <footer>数据云端存储 · 分次盘点自动同步 · 扫码即确认在库</footer>
</div>
<div id="toastMsg" class="toast-msg" style="opacity:0;">提示</div>

<script>
    // ----------------------------- 1. 配置 Firebase (云端存储解决方案) ---------------------------------
    // 注意：为了可运行，此处给出占位配置，用户需要根据自己 Firebase 项目替换以下配置。
    // 步骤：创建 Firebase 项目 → 启用 Firestore → 复制 web 应用配置。
    // 安全规则（测试/演示）可设置： allow read, write: if true; （生产环境建议基于用户认证）
    const firebaseConfig = {
        // 请替换为自己的 Firebase 项目配置 (本示例为了展示功能，使用演示配置无效，需用户自备)
        // 下方为示例占位，真正使用时请去 Firebase 控制台获取。
        apiKey: "AIzaSyDummyPlaceholderReplaceWithYourOwnKey",
        authDomain: "inventory-scanner-demo.firebaseapp.com",
        projectId: "inventory-scanner-demo",
        storageBucket: "inventory-scanner-demo.appspot.com",
        messagingSenderId: "123456789012",
        appId: "1:123456789012:web:abcdef123456"
    };
    // 若未配置正确的firebase，提示用户，但为了功能不崩溃，采用本地模拟？但要求云端存储，必须提示。
    // 为了演示能在不配置时友好提示，但仍然尝试初始化；若配置错误则提醒并降级但依然允许本地临时存？必须严格按照“云端储存”要求
    // 所以会初始化真实的Firebase，如果用户未替换会报错，我们在控制台给出指示, 但为了让界面正常，会捕捉错误并提示连接失败。
    // 更好的做法: 显示配置指引，但功能上会尝试连接云端; 为了真实验证，我将在代码中加详细指引。
    let db;
    let firebaseInitialized = false;
    try {
        if (firebase.apps.length === 0) {
            firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();
        // 测试连接
        console.log("Firebase 已初始化，等待云端同步");
        firebaseInitialized = true;
    } catch (e) {
        console.error("Firebase 初始化失败，请检查配置：", e);
        // 用户未正确配置时，弹窗提示，且数据无法云端存储, 但仍可演示本地临时数据? 但要求云端, 必须停止使用并提示。
        // 为了让工具完整，会在页面顶部显示错误提示，但不影响扫码体验但数据不会持久化。为了满足题目，确保给出配置说明。
        document.body.insertAdjacentHTML('afterbegin', '<div style="background:#ffeded; color:#b91c1c; padding:10px; text-align:center; margin-bottom:10px; border-radius:20px;">⚠️ Firebase 未正确配置，云端存储不可用！请配置正确的 firebaseConfig 以保证数据云端同步。</div>');
        // 降级提供localStorage模拟，但不再符合云端严格需求，但至少让扫码不报错且演示功能。
        // 但题目强烈要求云端储存，我将在注释强调必须配置。
        firebaseInitialized = false;
    }

    // 集合名称
    const COLLECTION_NAME = "inventory_items";

    // 全局数据列表 (实时更新)
    let inventoryData = [];      // 存储 { id, code, lastScanned, status }

    // 防重复扫描flag + 时间锁
    let lastScannedCode = "";
    let scanPending = false;

    // 扫码器实例
    let html5QrCode;
    let currentCameraId = "environment"; // 后置默认
    let isScanning = false;

    // DOM 元素
    const inventoryListDiv = document.getElementById('inventoryList');
    const totalCountSpan = document.getElementById('totalCount');
    const exportBtn = document.getElementById('exportExcelBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const switchCameraBtn = document.getElementById('switchCameraBtn');
    const restartScanBtn = document.getElementById('restartScanBtn');
    const manualCodeInput = document.getElementById('manualCodeInput');
    const manualAddBtn = document.getElementById('manualAddBtn');
    const toastMsgDiv = document.getElementById('toastMsg');

    // 显示提示消息
    function showToast(message, duration = 2000) {
        toastMsgDiv.innerText = message;
        toastMsgDiv.style.opacity = '1';
        setTimeout(() => {
            toastMsgDiv.style.opacity = '0';
        }, duration);
    }

    // 格式化时间 (Firestore Timestamp 或 Date)
    function formatDate(date) {
        if (!date) return '未知时间';
        const d = date.toDate ? date.toDate() : new Date(date);
        return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
    }

    // 渲染前端列表
    function renderList() {
        if (!inventoryListDiv) return;
        if (inventoryData.length === 0) {
            inventoryListDiv.innerHTML = '<div class="empty-list">✨ 暂无盘点记录，扫描二维码确认配件在库 ✨</div>';
            totalCountSpan.innerText = '0';
            return;
        }
        totalCountSpan.innerText = inventoryData.length;
        let html = '';
        inventoryData.forEach(item => {
            const timeStr = item.lastScanned ? formatDate(item.lastScanned) : '刚刚盘点';
            html += `
                <div class="inventory-item" data-id="${item.id}">
                    <div class="item-code">${escapeHtml(item.code)}</div>
                    <div class="item-info">
                        <div class="item-time">${timeStr}</div>
                        <div class="item-status">✅ 在库</div>
                    </div>
                    <button class="delete-item" data-code="${item.code}" data-id="${item.id}">🗑️</button>
                </div>
            `;
        });
        inventoryListDiv.innerHTML = html;
        // 绑定删除事件 (事件委托)
        document.querySelectorAll('.delete-item').forEach(btn => {
            btn.removeEventListener('click', handleDelete);
            btn.addEventListener('click', handleDelete);
        });
    }

    // 删除处理
    async function handleDelete(e) {
        e.stopPropagation();
        const code = e.currentTarget.getAttribute('data-code');
        const id = e.currentTarget.getAttribute('data-id');
        if (!code && !id) return;
        if (!firebaseInitialized) {
            showToast("云端未连接，无法删除", 1500);
            return;
        }
        try {
            // 根据文档ID删除（文档ID我们存储的是配件码）
            await db.collection(COLLECTION_NAME).doc(code).delete();
            showToast(`已移除配件: ${code.substring(0, 20)}`, 1000);
            // 实时监听会自动刷新，但我们也手动触发刷新（避免监听延迟）
            fetchDataFromCloud();
        } catch (err) {
            console.error("删除失败", err);
            showToast("删除失败，请重试", 1500);
        }
    }

    // 从云端获取所有数据并实时渲染 (监听快照)
    let unsubscribe = null;
    function listenToCloud() {
        if (!firebaseInitialized || !db) return;
        if (unsubscribe) unsubscribe();
        const collectionRef = db.collection(COLLECTION_NAME).orderBy("lastScanned", "desc");
        unsubscribe = collectionRef.onSnapshot(snapshot => {
            const items = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                items.push({
                    id: doc.id,
                    code: data.code || doc.id,
                    lastScanned: data.lastScanned,
                    status: data.status || "in_stock"
                });
            });
            inventoryData = items;
            renderList();
        }, error => {
            console.error("监听云端失败", error);
            showToast("云端同步异常，检查网络或配置", 2000);
        });
    }

    // 主动拉取一次数据 (删除后或手动刷新)
    async function fetchDataFromCloud() {
        if (!firebaseInitialized) return;
        try {
            const snapshot = await db.collection(COLLECTION_NAME).orderBy("lastScanned", "desc").get();
            const items = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                items.push({
                    id: doc.id,
                    code: data.code || doc.id,
                    lastScanned: data.lastScanned,
                    status: data.status || "in_stock"
                });
            });
            inventoryData = items;
            renderList();
        } catch (e) {
            console.warn(e);
        }
    }

    // 核心：添加/更新配件（在库确认） upsert 根据配件码
    async function addOrUpdateInventory(code) {
        if (!code || code.trim() === "") {
            showToast("无效的配件码", 1000);
            return false;
        }
        const trimmedCode = code.trim();
        if (!firebaseInitialized) {
            showToast("云端未连接，无法存储，请检查Firebase配置", 2000);
            return false;
        }
        try {
            const docRef = db.collection(COLLECTION_NAME).doc(trimmedCode);
            const docSnap = await docRef.get();
            const now = firebase.firestore.FieldValue.serverTimestamp();
            if (docSnap.exists) {
                // 更新盘点时间
                await docRef.update({
                    lastScanned: now,
                    status: "in_stock"
                });
                showToast(`🔄 更新盘点: ${trimmedCode.substring(0, 24)}`, 1200);
            } else {
                // 新增配件记录
                await docRef.set({
                    code: trimmedCode,
                    lastScanned: now,
                    status: "in_stock",
                    createdAt: now
                });
                showToast(`✅ 新增在库配件: ${trimmedCode.substring(0, 24)}`, 1200);
            }
            // 触发刷新（监听会自动更新，但手动确保）
            return true;
        } catch (err) {
            console.error("云端写入错误", err);
            showToast("云端保存失败: " + err.message, 2000);
            return false;
        }
    }

    // 清空所有盘点数据 (慎用)
    async function clearAllInventory() {
        if (!firebaseInitialized) {
            showToast("云端未连接，无法清空", 1500);
            return;
        }
        if (inventoryData.length === 0) return;
        const confirmClear = confirm("⚠️ 警告：将删除云端所有盘点记录，无法恢复。确定清空吗？");
        if (!confirmClear) return;
        try {
            const batch = db.batch();
            const snapshot = await db.collection(COLLECTION_NAME).get();
            snapshot.forEach(doc => {
                batch.delete(doc.ref);
            });
            await batch.commit();
            showToast("已清空所有盘点数据", 1500);
            // 监听会自动刷新
        } catch (err) {
            showToast("清空失败", 1500);
        }
    }

    // 导出Excel表格
    async function exportToExcel() {
        if (!firebaseInitialized) {
            showToast("云端未同步，无法获取最新数据", 1500);
            return;
        }
        // 获取最新快照保证导出完整
        let exportData = [];
        try {
            const snapshot = await db.collection(COLLECTION_NAME).orderBy("lastScanned", "desc").get();
            if (snapshot.empty) {
                showToast("暂无数据可导出", 1000);
                return;
            }
            snapshot.forEach(doc => {
                const d = doc.data();
                let timeValue = d.lastScanned;
                let timeStr = "";
                if (timeValue) {
                    const ts = timeValue.toDate ? timeValue.toDate() : new Date(timeValue);
                    timeStr = `${ts.getFullYear()}-${(ts.getMonth()+1).toString().padStart(2,'0')}-${ts.getDate().toString().padStart(2,'0')} ${ts.getHours().toString().padStart(2,'0')}:${ts.getMinutes().toString().padStart(2,'0')}:${ts.getSeconds().toString().padStart(2,'0')}`;
                } else {
                    timeStr = "未知";
                }
                exportData.push({
                    "配件码": d.code || doc.id,
                    "盘点状态": "在库",
                    "最后盘点时间": timeStr,
                    "备注": "二维码扫码确认"
                });
            });
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "配件盘点清单");
            const currentDate = new Date();
            const fileName = `配件盘点记录_${currentDate.getFullYear()}-${(currentDate.getMonth()+1).toString().padStart(2,'0')}-${currentDate.getDate().toString().padStart(2,'0')}.xlsx`;
            XLSX.writeFile(wb, fileName);
            showToast(`导出成功，共 ${exportData.length} 条记录`, 2000);
        } catch (err) {
            console.error(err);
            showToast("导出失败，请重试", 1500);
        }
    }

    // 扫码成功回调 (去重 + 防抖)
    function onScanSuccess(decodedText, decodedResult) {
        if (scanPending) return;
        const nowCode = decodedText;
        if (lastScannedCode === nowCode) {
            // 相同码1秒内防重复扫描
            return;
        }
        lastScannedCode = nowCode;
        scanPending = true;
        // 调用云端记录
        addOrUpdateInventory(nowCode).finally(() => {
            setTimeout(() => {
                scanPending = false;
            }, 800);
        });
        // 可选振动 (手机支持)
        if (navigator.vibrate) navigator.vibrate(100);
    }

    // 初始化扫码器 (带优化对焦，调后置摄像头)
    async function initScanner(cameraId = "environment") {
        if (html5QrCode) {
            try {
                await html5QrCode.stop();
            } catch (e) { console.warn(e); }
        }
        const qrReaderDiv = document.getElementById('qr-reader');
        qrReaderDiv.innerHTML = ""; // 清空
        html5QrCode = new Html5Qrcode("qr-reader");
        const config = {
            fps: 10,
            qrbox: { width: 280, height: 280 },
            aspectRatio: 1.0,
            // 开启对焦模式：调用advancedCamera的focusMode
            videoConstraints: {
                facingMode: cameraId === "environment" ? "environment" : "user",
                focusMode: "continuous",
                advanced: [{ focusMode: "continuous" }]
            }
        };
        try {
            await html5QrCode.start(
                { facingMode: cameraId === "environment" ? "environment" : "user" },
                config,
                onScanSuccess,
                (errorMessage) => {
                    // 忽略一般扫描错误
                    // console.debug(errorMessage);
                }
            );
            isScanning = true;
            showToast("相机已启动，对准二维码即可自动盘点", 1500);
        } catch (err) {
            console.error("摄像头启动失败", err);
            showToast("无法调用摄像头，请检查权限并刷新页面重试", 2000);
            isScanning = false;
        }
    }

    // 切换摄像头
    async function switchCamera() {
        if (!html5QrCode || !isScanning) {
            showToast("请先等待扫描器启动", 1000);
            return;
        }
        currentCameraId = currentCameraId === "environment" ? "user" : "environment";
        await initScanner(currentCameraId);
        showToast(currentCameraId === "environment" ? "已切换到后置摄像头" : "已切换到前置摄像头", 1000);
    }

    // 重启扫描 (解决对焦异常)
    async function restartScanner() {
        if (html5QrCode && isScanning) {
            await initScanner(currentCameraId);
            showToast("扫描器已重启，对焦优化", 1000);
        } else {
            await initScanner(currentCameraId);
        }
    }

    // 手动添加配件码
    function manualAddCode() {
        let rawCode = manualCodeInput.value.trim();
        if (rawCode === "") {
            showToast("请输入配件码", 1000);
            return;
        }
        addOrUpdateInventory(rawCode);
        manualCodeInput.value = "";
    }

    // 简单防XSS
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).substring(0, 60);
    }

    // 绑定事件
    exportBtn.addEventListener('click', exportToExcel);
    clearAllBtn.addEventListener('click', clearAllInventory);
    switchCameraBtn.addEventListener('click', switchCamera);
    restartScanBtn.addEventListener('click', restartScanner);
    manualAddBtn.addEventListener('click', manualAddCode);
    manualCodeInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') manualAddCode();
    });

    // 初始化应用: 云端监听 + 启动扫描器
    window.addEventListener('load', async () => {
        if (firebaseInitialized) {
            listenToCloud();   // 实时同步
        } else {
            // 没有云端，但仍显示本地演示（但不符合要求，提示用户配置）
            inventoryListDiv.innerHTML = '<div class="empty-list">⚠️ 云端未配置，请配置Firebase后再使用完整功能 ⚠️</div>';
        }
        await initScanner("environment");
    });

    // 页面关闭前停止摄像头释放资源
    window.addEventListener('beforeunload', async () => {
        if (html5QrCode && isScanning) {
            try {
                await html5QrCode.stop();
            } catch(e) {}
        }
        if (unsubscribe) unsubscribe();
    });
</script>
</body>
</html>
