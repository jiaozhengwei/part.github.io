<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码扫描匹配系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            overflow: hidden; 
        }
        
        .header { 
            background: linear-gradient(to right, #4a6ee0, #5a3ec8); 
            color: white; 
            padding: 25px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .header h1 { font-size: 28px; font-weight: 600; }
        .stats { display: flex; gap: 20px; font-size: 16px; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 24px; font-weight: 700; display: block; }
        
        .main-content { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 30px; 
            padding: 30px; 
        }
        
        .scanner-section { 
            background: #f8f9fa; 
            border-radius: 15px; 
            padding: 25px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); 
        }
        
        .video-container { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 4/3; 
            background: #000; 
            border-radius: 10px; 
            overflow: hidden; 
            margin-bottom: 20px; 
        }
        
        #scannerVideo { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .scanner-overlay { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; 
            height: 100%; 
            display: grid; 
            grid-template-columns: 1fr 3fr 1fr; 
            grid-template-rows: 1fr 3fr 1fr; 
        }
        
        .scan-line { 
            grid-column: 1 / -1; 
            grid-row: 2; 
            height: 3px; 
            background: linear-gradient(90deg, transparent, #00ff00, transparent); 
            animation: scan 2s linear infinite; 
        }
        
        @keyframes scan { 
            0% { transform: translateY(-100%); } 
            100% { transform: translateY(200%); } 
        }
        
        .control-panel { 
            display: flex; 
            gap: 15px; 
            flex-wrap: wrap; 
            margin-bottom: 20px; 
        }
        
        .btn { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        
        .btn-primary { 
            background: linear-gradient(to right, #4a6ee0, #5a3ec8); 
            color: white; 
        }
        
        .btn-success { 
            background: linear-gradient(to right, #20c997, #17a2b8); 
            color: white; 
        }
        
        .btn-danger { 
            background: linear-gradient(to right, #dc3545, #c82333); 
            color: white; 
        }
        
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .result-panel { 
            background: white; 
            border-radius: 10px; 
            padding: 20px; 
            border: 2px solid #e9ecef; 
            margin-top: 20px; 
        }
        
        .qr-data { 
            font-family: 'Courier New', monospace; 
            font-size: 16px; 
            color: #333; 
            margin-bottom: 15px; 
        }
        
        .data-segments { 
            display: flex; 
            gap: 10px; 
            margin: 10px 0; 
            flex-wrap: wrap; 
        }
        
        .segment { 
            padding: 8px 12px; 
            border-radius: 6px; 
            font-weight: 600; 
            font-size: 14px; 
        }
        
        .segment-b { background: #e3f2fd; color: #1565c0; border: 2px solid #bbdefb; }
        .segment-g { background: #f3e5f5; color: #7b1fa2; border: 2px solid #e1bee7; }
        .segment-n { background: #f1f8e9; color: #558b2f; border: 2px solid #dcedc8; }
        
        .match-status { 
            padding: 10px; 
            border-radius: 8px; 
            font-weight: 600; 
            text-align: center; 
        }
        
        .match-success { background: #d4edda; color: #155724; }
        .match-fail { background: #f8d7da; color: #721c24; }
        
        .data-section { 
            background: white; 
            border-radius: 15px; 
            padding: 25px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); 
        }
        
        .data-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
        }
        
        .table-container { 
            max-height: 500px; 
            overflow-y: auto; 
            border: 1px solid #dee2e6; 
            border-radius: 8px; 
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        
        th { 
            background: linear-gradient(to bottom, #f8f9fa, #e9ecef); 
            padding: 12px 15px; 
            text-align: left; 
            border-bottom: 2px solid #dee2e6; 
            position: sticky; 
            top: 0; 
        }
        
        td { 
            padding: 10px 15px; 
            border-bottom: 1px solid #dee2e6; 
        }
        
        tr:hover { background: #f8f9fa; }
        
        .status-passed { 
            background: #d4edda; 
            color: #155724; 
            font-weight: 600; 
            padding: 4px 8px; 
            border-radius: 4px; 
        }
        
        .highlight { 
            background: #fff3cd !important; 
            transition: background 0.5s; 
        }
        
        .log-section { 
            grid-column: 1 / -1; 
            background: white; 
            border-radius: 15px; 
            padding: 25px; 
            margin-top: 20px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); 
        }
        
        .log-container { 
            max-height: 200px; 
            overflow-y: auto; 
            border: 1px solid #dee2e6; 
            border-radius: 8px; 
            padding: 15px; 
            font-family: 'Courier New', monospace; 
            font-size: 13px; 
        }
        
        .log-entry { 
            padding: 5px 0; 
            border-bottom: 1px solid #f0f0f0; 
        }
        
        .log-success { color: #28a745; }
        .log-error { color: #dc3545; }
        .log-info { color: #17a2b8; }
        
        .toast-container { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            z-index: 1000; 
        }
        
        .toast { 
            background: white; 
            border-radius: 8px; 
            padding: 15px 20px; 
            margin-bottom: 10px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
            border-left: 4px solid; 
            animation: slideIn 0.3s; 
        }
        
        .toast-success { border-color: #28a745; }
        .toast-error { border-color: #dc3545; }
        .toast-info { border-color: #17a2b8; }
        
        @keyframes slideIn { 
            from { transform: translateX(100%); opacity: 0; } 
            to { transform: translateX(0); opacity: 1; } 
        }
        
        .loading { 
            display: inline-block; 
            width: 20px; 
            height: 20px; 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid #4a6ee0; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        @media (max-width: 768px) { 
            .main-content { grid-template-columns: 1fr; } 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 二维码扫描匹配系统</h1>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-value" id="totalCount">0</span>
                    <span>总数</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="passedCount">0</span>
                    <span>已通过</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="scanCount">0</span>
                    <span>扫描次数</span>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="scanner-section">
                <h2 style="margin-bottom: 20px;">🔍 扫描区域</h2>
                <div class="video-container">
                    <video id="scannerVideo" playsinline></video>
                    <div class="scanner-overlay">
                        <div class="scan-line"></div>
                    </div>
                </div>
                
                <div class="control-panel">
                    <button id="startBtn" class="btn btn-primary">
                        <span id="startIcon">▶️</span>
                        <span id="startText">开始扫描</span>
                    </button>
                    <button id="uploadBtn" class="btn btn-success">
                        📁 上传数据
                    </button>
                    <button id="exportBtn" class="btn btn-success">
                        📥 导出结果
                    </button>
                    <button id="clearBtn" class="btn btn-danger">
                        🗑️ 清除数据
                    </button>
                </div>
                
                <div id="scannerStatus" style="padding: 10px; text-align: center; font-weight: 600;">
                    等待启动摄像头...
                </div>
                
                <div class="result-panel">
                    <h3 style="margin-bottom: 10px;">📊 当前扫描结果</h3>
                    <div class="qr-data" id="qrData">等待扫描...</div>
                    
                    <div id="segments" class="data-segments" style="display: none;">
                        <div class="segment segment-b">
                            B列匹配: <span id="segmentB">-</span>
                        </div>
                        <div class="segment segment-g">
                            G列匹配: <span id="segmentG">-</span>
                        </div>
                        <div class="segment segment-n">
                            N列匹配: <span id="segmentN">-</span>
                        </div>
                    </div>
                    
                    <div id="matchResult" class="match-status" style="display: none;">
                        匹配结果
                    </div>
                </div>
            </div>
            
            <div class="data-section">
                <div class="data-header">
                    <h2>📋 数据表格</h2>
                    <div>
                        <input type="file" id="fileInput" accept=".csv" style="display: none;">
                        <button id="manualAddBtn" class="btn btn-primary" style="font-size: 14px;">
                            ➕ 添加测试数据
                        </button>
                    </div>
                </div>
                
                <div class="table-container">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th width="50">#</th>
                                <th width="120">B列</th>
                                <th width="120">G列</th>
                                <th width="150">N列</th>
                                <th width="100">T列</th>
                                <th>其他信息</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- 数据将通过JS动态加载 -->
                        </tbody>
                    </table>
                </div>
                
                <div style="margin-top: 20px; color: #666; font-size: 14px;">
                    <p>💡 说明：</p>
                    <p>1. 扫描结果将提取第6-12位与B列对比，第13-19位与G列对比，第20位到最后与N列对比</p>
                    <p>2. 三项匹配成功时，自动在T列标记"通过"</p>
                </div>
            </div>
            
            <div class="log-section">
                <h2 style="margin-bottom: 15px;">📝 操作日志</h2>
                <div class="log-container" id="logContainer">
                    <div class="log-entry log-info">系统就绪，请上传数据并开始扫描</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- 导入jsQR库 -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <script>
        // 状态管理
        const STATE = {
            isScanning: false,
            currentScanResult: null,
            mediaStream: null,
            scanInterval: null,
            tableData: [],
            scanStats: {
                total: 0,
                passed: 0,
                scans: 0
            },
            lastScanTime: null
        };
        
        // DOM元素引用
        const dom = {
            scannerVideo: document.getElementById('scannerVideo'),
            startBtn: document.getElementById('startBtn'),
            uploadBtn: document.getElementById('uploadBtn'),
            exportBtn: document.getElementById('exportBtn'),
            clearBtn: document.getElementById('clearBtn'),
            fileInput: document.getElementById('fileInput'),
            manualAddBtn: document.getElementById('manualAddBtn'),
            scannerStatus: document.getElementById('scannerStatus'),
            qrData: document.getElementById('qrData'),
            segments: document.getElementById('segments'),
            segmentB: document.getElementById('segmentB'),
            segmentG: document.getElementById('segmentG'),
            segmentN: document.getElementById('segmentN'),
            matchResult: document.getElementById('matchResult'),
            tableBody: document.getElementById('tableBody'),
            logContainer: document.getElementById('logContainer'),
            toastContainer: document.getElementById('toastContainer'),
            totalCount: document.getElementById('totalCount'),
            passedCount: document.getElementById('passedCount'),
            scanCount: document.getElementById('scanCount'),
            startIcon: document.getElementById('startIcon'),
            startText: document.getElementById('startText')
        };
        
        // 音效
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(frequency, duration, type = 'sine') {
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = frequency;
                oscillator.type = type;
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            } catch (e) {
                console.log('音频播放失败:', e);
            }
        }
        
        // 工具函数
        function showToast(message, type = 'info', duration = 3000) {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            
            dom.toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s reverse';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }
        
        function addLog(message, type = 'info') {
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            
            dom.logContainer.prepend(logEntry);
            
            // 限制日志数量
            if (dom.logContainer.children.length > 50) {
                dom.logContainer.removeChild(dom.logContainer.lastChild);
            }
            
            // 自动滚动到底部
            dom.logContainer.scrollTop = 0;
        }
        
        // 二维码分析函数 - 根据新需求优化
        function analyzeQR(text) {
            if (!text || text.trim() === '') {
                return { success: false, error: '二维码内容为空' };
            }
            
            // 移除所有空格
            const cleanText = text.replace(/\s+/g, '');
            
            // 检查最小长度
            if (cleanText.length < 20) {
                return { 
                    success: false, 
                    error: `内容长度不足20位 (当前: ${cleanText.length}位)`,
                    cleanText 
                };
            }
            
            // 提取各部分
            let partB, partG, partN;
            
            try {
                // 第6-12位 (索引5-11，因为索引从0开始)
                partB = cleanText.substring(5, 12);
                
                // 第13-19位 (索引12-18)
                partG = cleanText.substring(12, 19);
                
                // 第20位到最后 (索引19到最后)
                partN = cleanText.substring(19);
                
                if (partB.length !== 7 || partG.length !== 7 || partN.length === 0) {
                    return { 
                        success: false, 
                        error: '数据格式不正确',
                        cleanText,
                        partB,
                        partG,
                        partN
                    };
                }
                
                return {
                    success: true,
                    originalText: text,
                    cleanText: cleanText,
                    partB: partB,
                    partG: partG,
                    partN: partN
                };
            } catch (error) {
                return { 
                    success: false, 
                    error: '数据解析失败: ' + error.message,
                    cleanText 
                };
            }
        }
        
        // 扫描处理函数
        function processScan(qrText) {
            if (STATE.currentScanResult === qrText) {
                return; // 避免重复处理同一二维码
            }
            
            STATE.currentScanResult = qrText;
            STATE.scanStats.scans++;
            dom.scanCount.textContent = STATE.scanStats.scans;
            
            addLog(`扫描到: ${qrText}`, 'info');
            dom.qrData.textContent = qrText;
            
            // 分析二维码
            const analysis = analyzeQR(qrText);
            
            if (!analysis.success) {
                showToast(`❌ ${analysis.error}`, 'error');
                playBeep(300, 0.2, 'square');
                
                // 显示部分信息
                dom.segments.style.display = 'flex';
                dom.segmentB.textContent = analysis.partB || '-';
                dom.segmentG.textContent = analysis.partG || '-';
                dom.segmentN.textContent = analysis.partN || '-';
                
                dom.matchResult.textContent = '❌ 匹配失败: ' + analysis.error;
                dom.matchResult.className = 'match-status match-fail';
                dom.matchResult.style.display = 'block';
                
                return;
            }
            
            // 显示提取的片段
            dom.segments.style.display = 'flex';
            dom.segmentB.textContent = analysis.partB;
            dom.segmentG.textContent = analysis.partG;
            dom.segmentN.textContent = analysis.partN;
            
            // 查找匹配的行
            const matches = STATE.tableData.filter(row => {
                const rowB = String(row.B || '').trim();
                const rowG = String(row.G || '').trim();
                const rowN = String(row.N || '').trim();
                
                return rowB === analysis.partB;
            });
            
            if (matches.length === 0) {
                showToast(`⚠️ 未找到B列匹配: ${analysis.partB}`, 'error');
                playBeep(400, 0.2, 'square');
                
                dom.matchResult.textContent = `❌ 未找到B列匹配: ${analysis.partB}`;
                dom.matchResult.className = 'match-status match-fail';
                dom.matchResult.style.display = 'block';
                return;
            }
            
            // 完全匹配检查
            const fullMatches = matches.filter(row => {
                const rowB = String(row.B || '').trim();
                const rowG = String(row.G || '').trim();
                const rowN = String(row.N || '').trim();
                
                return rowB === analysis.partB && 
                       rowG === analysis.partG && 
                       rowN === analysis.partN;
            });
            
            if (fullMatches.length === 0) {
                // 部分匹配检查
                const partialMatches = matches.filter(row => {
                    const rowG = String(row.G || '').trim();
                    const rowN = String(row.N || '').trim();
                    
                    return rowG === analysis.partG || rowN === analysis.partN;
                });
                
                if (partialMatches.length > 0) {
                    showToast(`⚠️ 部分匹配: B=${analysis.partB}`, 'error');
                    playBeep(450, 0.2, 'sawtooth');
                    
                    dom.matchResult.innerHTML = `⚠️ 部分匹配: B=${analysis.partB}<br>检查G/N列数据`;
                    dom.matchResult.className = 'match-status match-fail';
                    dom.matchResult.style.display = 'block';
                } else {
                    showToast(`❌ 三项均不匹配: B=${analysis.partB}`, 'error');
                    playBeep(300, 0.3, 'square');
                    
                    dom.matchResult.innerHTML = `❌ 完全匹配失败<br>B=${analysis.partB}<br>检查G列和N列数据`;
                    dom.matchResult.className = 'match-status match-fail';
                    dom.matchResult.style.display = 'block';
                }
                return;
            }
            
            // 三项匹配成功
            let updatedCount = 0;
            fullMatches.forEach(row => {
                if (row.T !== '通过') {
                    row.T = '通过';
                    row.lastScanTime = new Date().toLocaleString();
                    updatedCount++;
                }
            });
            
            if (updatedCount > 0) {
                STATE.scanStats.passed += updatedCount;
                dom.passedCount.textContent = STATE.scanStats.passed;
                
                showToast(`✅ ${updatedCount} 项标记为通过`, 'success');
                playBeep(800, 0.1, 'sine');
                playBeep(1000, 0.1, 'sine');
                
                dom.matchResult.textContent = `✅ 匹配成功! ${updatedCount} 项已标记为通过`;
                dom.matchResult.className = 'match-status match-success';
                dom.matchResult.style.display = 'block';
                
                // 更新表格显示
                renderTable();
                // 高亮匹配的行
                highlightMatchedRows(fullMatches);
            } else {
                showToast(`ℹ️ ${analysis.partB} 已通过`, 'info');
                playBeep(600, 0.1, 'sine');
                
                dom.matchResult.textContent = '✅ 已通过，无需重复标记';
                dom.matchResult.className = 'match-status match-success';
                dom.matchResult.style.display = 'block';
            }
            
            // 保存到本地存储
            saveToLocalStorage();
        }
        
        // 高亮匹配的行
        function highlightMatchedRows(rows) {
            const tableRows = dom.tableBody.querySelectorAll('tr');
            
            tableRows.forEach(row => {
                row.classList.remove('highlight');
            });
            
            // 延迟一小段时间后添加高亮效果
            setTimeout(() => {
                rows.forEach(matchRow => {
                    const index = STATE.tableData.indexOf(matchRow);
                    if (index !== -1 && tableRows[index]) {
                        tableRows[index].classList.add('highlight');
                        
                        // 移除高亮效果
                        setTimeout(() => {
                            tableRows[index].classList.remove('highlight');
                        }, 3000);
                    }
                });
            }, 100);
        }
        
        // 渲染表格
        function renderTable() {
            dom.tableBody.innerHTML = '';
            
            STATE.tableData.forEach((row, index) => {
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${row.B || ''}</td>
                    <td>${row.G || ''}</td>
                    <td>${row.N || ''}</td>
                    <td>
                        ${row.T === '通过' 
                            ? '<span class="status-passed">通过</span>' 
                            : '<span style="color: #999;">-</span>'}
                    </td>
                    <td>${row.info || ''}</td>
                `;
                
                dom.tableBody.appendChild(tr);
            });
            
            dom.totalCount.textContent = STATE.tableData.length;
        }
        
        // 解码帧
        function decodeFrame(video) {
            if (video.readyState < 2 || video.videoWidth === 0) {
                return Promise.resolve(null);
            }
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            // 设置画布尺寸为视频尺寸
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // 绘制视频帧到画布
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 获取图像数据
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            try {
                // 使用jsQR解码
                const code = jsQR(imageData.data, canvas.width, canvas.height, {
                    inversionAttempts: "dontInvert",
                });
                
                return Promise.resolve(code ? code.data : null);
            } catch (error) {
                console.error('解码错误:', error);
                return Promise.resolve(null);
            }
        }
        
        // 扫描循环
        function scanLoop() {
            if (!STATE.isScanning) return;
            
            decodeFrame(dom.scannerVideo).then(result => {
                if (result) {
                    processScan(result);
                    
                    // 短暂暂停以防止重复扫描同一二维码
                    setTimeout(() => {
                        if (STATE.isScanning) {
                            STATE.scanInterval = requestAnimationFrame(scanLoop);
                        }
                    }, 500);
                } else {
                    STATE.scanInterval = requestAnimationFrame(scanLoop);
                }
            }).catch(error => {
                console.error('扫描错误:', error);
                STATE.scanInterval = requestAnimationFrame(scanLoop);
            });
        }
        
        // 开始扫描
        async function startScanning() {
            if (STATE.isScanning) {
                stopScanning();
                return;
            }
            
            try {
                STATE.mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                dom.scannerVideo.srcObject = STATE.mediaStream;
                dom.scannerVideo.play();
                
                STATE.isScanning = true;
                dom.startIcon.textContent = '⏸️';
                dom.startText.textContent = '停止扫描';
                dom.scannerStatus.textContent = '🟢 扫描中...';
                dom.scannerStatus.style.color = '#28a745';
                
                // 等待视频准备就绪
                dom.scannerVideo.onloadedmetadata = () => {
                    setTimeout(() => {
                        STATE.scanInterval = requestAnimationFrame(scanLoop);
                    }, 500);
                };
                
                addLog('开始扫描', 'success');
                showToast('开始扫描', 'success');
                
            } catch (error) {
                console.error('摄像头访问错误:', error);
                showToast('无法访问摄像头: ' + error.message, 'error');
                addLog('摄像头访问失败: ' + error.message, 'error');
            }
        }
        
        // 停止扫描
        function stopScanning() {
            STATE.isScanning = false;
            
            if (STATE.scanInterval) {
                cancelAnimationFrame(STATE.scanInterval);
                STATE.scanInterval = null;
            }
            
            if (STATE.mediaStream) {
                STATE.mediaStream.getTracks().forEach(track => track.stop());
                STATE.mediaStream = null;
            }
            
            dom.scannerVideo.srcObject = null;
            dom.startIcon.textContent = '▶️';
            dom.startText.textContent = '开始扫描';
            dom.scannerStatus.textContent = '摄像头已关闭';
            dom.scannerStatus.style.color = '#666';
            
            addLog('停止扫描', 'info');
        }
        
        // 上传数据文件
        function uploadDataFile(file) {
            if (!file) return;
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    const lines = content.split('\n');
                    const headers = lines[0].split(',').map(h => h.trim());
                    
                    // 查找B、G、N、T列的索引
                    const bIndex = headers.findIndex(h => h === 'B' || h === 'b');
                    const gIndex = headers.findIndex(h => h === 'G' || h === 'g');
                    const nIndex = headers.findIndex(h => h === 'N' || h === 'n');
                    const tIndex = headers.findIndex(h => h === 'T' || h === 't');
                    
                    if (bIndex === -1 || gIndex === -1 || nIndex === -1) {
                        showToast('CSV文件必须包含B、G、N列', 'error');
                        addLog('CSV文件缺少必要列', 'error');
                        return;
                    }
                    
                    // 解析数据
                    STATE.tableData = [];
                    
                    for (let i = 1; i < lines.length; i++) {
                        if (lines[i].trim() === '') continue;
                        
                        const cells = lines[i].split(',').map(c => c.trim());
                        const row = {
                            B: cells[bIndex] || '',
                            G: cells[gIndex] || '',
                            N: cells[nIndex] || '',
                            T: tIndex !== -1 ? cells[tIndex] || '' : '',
                            info: cells.slice(Math.max(bIndex, gIndex, nIndex, tIndex) + 1).join(', ') || ''
                        };
                        
                        STATE.tableData.push(row);
                    }
                    
                    // 统计已通过的项
                    STATE.scanStats.passed = STATE.tableData.filter(row => row.T === '通过').length;
                    STATE.scanStats.total = STATE.tableData.length;
                    
                    renderTable();
                    saveToLocalStorage();
                    
                    showToast(`✅ 成功加载 ${STATE.tableData.length} 条数据`, 'success');
                    addLog(`上传数据文件: ${file.name}, 共 ${STATE.tableData.length} 条记录`, 'success');
                    
                } catch (error) {
                    console.error('文件解析错误:', error);
                    showToast('文件解析失败: ' + error.message, 'error');
                    addLog('文件解析失败: ' + error.message, 'error');
                }
            };
            
            reader.onerror = function() {
                showToast('文件读取失败', 'error');
                addLog('文件读取失败', 'error');
            };
            
            reader.readAsText(file);
        }
        
        // 导出结果
        function exportResults() {
            if (STATE.tableData.length === 0) {
                showToast('没有数据可导出', 'error');
                return;
            }
            
            const headers = ['B', 'G', 'N', 'T', '最后扫描时间'];
            const csvRows = [];
            
            // 添加表头
            csvRows.push(headers.join(','));
            
            // 添加数据行
            STATE.tableData.forEach(row => {
                const rowData = [
                    row.B || '',
                    row.G || '',
                    row.N || '',
                    row.T || '',
                    row.lastScanTime || ''
                ];
                csvRows.push(rowData.map(cell => `"${cell}"`).join(','));
            });
            
            const csvString = csvRows.join('\n');
            const blob = new Blob([csvString], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            a.href = url;
            a.download = `扫描结果_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            
            showToast(`✅ 已导出 ${STATE.tableData.length} 条记录`, 'success');
            addLog('导出扫描结果', 'success');
        }
        
        // 保存到本地存储
        function saveToLocalStorage() {
            try {
                const data = {
                    tableData: STATE.tableData,
                    scanStats: STATE.scanStats,
                    timestamp: new Date().toISOString()
                };
                localStorage.setItem('qrScannerData', JSON.stringify(data));
            } catch (e) {
                console.error('本地存储失败:', e);
            }
        }
        
        // 从本地存储加载
        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('qrScannerData');
                if (saved) {
                    const data = JSON.parse(saved);
                    STATE.tableData = data.tableData || [];
                    STATE.scanStats = data.scanStats || { total: 0, passed: 0, scans: 0 };
                    
                    // 更新统计显示
                    dom.totalCount.textContent = STATE.tableData.length;
                    dom.passedCount.textContent = STATE.scanStats.passed;
                    dom.scanCount.textContent = STATE.scanStats.scans || 0;
                    
                    renderTable();
                    addLog('从本地存储恢复数据', 'info');
                }
            } catch (e) {
                console.error('本地存储加载失败:', e);
            }
        }
        
        // 添加测试数据
        function addTestData() {
            const testData = [
                { B: '3020349', G: '5390001', N: 'A2465403215', T: '', info: '示例数据1' },
                { B: '3020348', G: '5390002', N: 'A2465403216', T: '', info: '示例数据2' },
                { B: '3020347', G: '5390003', N: 'A2465403217', T: '', info: '示例数据3' },
                { B: '3020346', G: '5390004', N: 'A2465403218', T: '', info: '示例数据4' },
                { B: '3020345', G: '5390005', N: 'A2465403219', T: '', info: '示例数据5' },
                { B: '3020344', G: '5390006', N: 'A2465403220', T: '', info: '示例数据6' },
                { B: '3020343', G: '5390007', N: 'A2465403221', T: '', info: '示例数据7' },
                { B: '3020342', G: '5390008', N: 'A2465403222', T: '', info: '示例数据8' },
                { B: '3020341', G: '5390009', N: 'A2465403223', T: '', info: '示例数据9' },
                { B: '3020340', G: '5390010', N: 'A2465403224', T: '', info: '示例数据10' }
            ];
            
            STATE.tableData = [...STATE.tableData, ...testData];
            STATE.scanStats.total = STATE.tableData.length;
            dom.totalCount.textContent = STATE.tableData.length;
            
            renderTable();
            saveToLocalStorage();
            
            showToast(`✅ 添加了 ${testData.length} 条测试数据`, 'success');
            addLog('添加测试数据', 'success');
        }
        
        // 清除数据
        function clearData() {
            if (confirm('确定要清除所有数据吗？此操作不可撤销。')) {
                STATE.tableData = [];
                STATE.scanStats = { total: 0, passed: 0, scans: 0 };
                
                dom.totalCount.textContent = '0';
                dom.passedCount.textContent = '0';
                dom.scanCount.textContent = '0';
                
                renderTable();
                localStorage.removeItem('qrScannerData');
                
                showToast('数据已清除', 'info');
                addLog('清除所有数据', 'info');
            }
        }
        
        // 事件监听器
        dom.startBtn.addEventListener('click', startScanning);
        
        dom.uploadBtn.addEventListener('click', () => {
            dom.fileInput.click();
        });
        
        dom.fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadDataFile(e.target.files[0]);
                e.target.value = ''; // 重置文件输入
            }
        });
        
        dom.exportBtn.addEventListener('click', exportResults);
        
        dom.clearBtn.addEventListener('click', clearData);
        
        dom.manualAddBtn.addEventListener('click', addTestData);
        
        // 页面卸载时停止扫描
        window.addEventListener('beforeunload', () => {
            if (STATE.isScanning) {
                stopScanning();
            }
        });
        
        // 页面加载时从本地存储恢复数据
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            
            // 添加示例说明
            addLog('系统初始化完成', 'info');
            addLog('示例数据格式: "84108 3020349 5390001 A2465403215"', 'info');
            addLog('B列匹配: 3020349, G列匹配: 5390001, N列匹配: A2465403215', 'info');
            
            // 初始化表格
            if (STATE.tableData.length === 0) {
                addTestData();
            }
        });
        
        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            // 空格键切换扫描
            if (e.code === 'Space' && !e.target.matches('input, textarea')) {
                e.preventDefault();
                dom.startBtn.click();
            }
            
            // Ctrl+E 导出
            if (e.ctrlKey && e.code === 'KeyE') {
                e.preventDefault();
                dom.exportBtn.click();
            }
            
            // Ctrl+U 上传
            if (e.ctrlKey && e.code === 'KeyU') {
                e.preventDefault();
                dom.fileInput.click();
            }
        });
        
        // 显示快捷键提示
        setTimeout(() => {
            addLog('快捷键: 空格=开始/停止扫描, Ctrl+E=导出, Ctrl+U=上传', 'info');
        }, 1000);
    </script>
</body>
</html>
