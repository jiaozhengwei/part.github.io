<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0, minimum-scale=1.0">
    <title>配件盘点工具 · 精准匹配版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --primary: #1a73e8; --success: #0d904f; --danger: #d93025; --warning: #e6a817;
            --bg: #f5f6f8; --card: #fff; --text: #202124; --border: #e0e0e0;
            --shadow: 0 2px 8px rgba(0,0,0,0.08); --radius: 14px;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: calc(80px + var(--safe-bottom)); -webkit-tap-highlight-color: transparent; line-height: 1.5; user-select: none; }
        .app-header { background: var(--card); padding:12px 16px; position:sticky; top:0; z-index:100; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:space-between; }
        .logo-area { display:flex; align-items:center; gap:10px; }
        .logo-icon { width:38px; height:38px; border-radius:10px; background: linear-gradient(135deg, #1a73e8, #4a9af5); display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; }
        .app-header h1 { font-size:18px; font-weight:700; }
        .main-content { padding:12px 14px; display:flex; flex-direction:column; gap:12px; max-width:600px; margin:0 auto; }
        .card { background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
        .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
        .card-title { font-size:15px; font-weight:600; display:flex; align-items:center; gap:7px; }
        .upload-zone { border:2px dashed #c5cae9; border-radius:10px; padding:22px; text-align:center; background:#fafbfd; position:relative; cursor:pointer; }
        .upload-zone.has-file { border-color:var(--success); background:#e6f4ea; }
        .upload-zone input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; }
        .file-info { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13px; color:var(--success); }
        .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
        .stat-item { background:var(--card); border-radius:10px; padding:14px 10px; text-align:center; box-shadow:var(--shadow); }
        .stat-value { font-size:28px; font-weight:700; }
        .stat-value.total { color:var(--primary); } .stat-value.passed { color:var(--success); } .stat-value.remaining { color:var(--warning); }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:25px; padding:13px 22px; font-size:15px; font-weight:600; cursor:pointer; transition:0.2s; min-height:46px; background:var(--primary); color:#fff; box-shadow:0 4px 14px rgba(26,115,232,0.3); }
        .btn:active { transform:scale(0.95); } .btn-outline { background:#fff; color:var(--primary); border:1.5px solid var(--primary); box-shadow:none; } .btn-sm { padding:8px 14px; font-size:13px; min-height:34px; border-radius:20px; }
        .scan-fab-container { display:flex; justify-content:center; gap:16px; padding:8px 0; }
        .scan-fab { width:90px; height:90px; border-radius:50%; border:none; font-size:36px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 28px rgba(26,115,232,0.4); transition:0.2s; }
        .scan-fab.video-scan { background:linear-gradient(135deg, #1a73e8, #4a9af5); color:#fff; } .scan-fab.photo-scan { background:linear-gradient(135deg, #0d904f, #2ecc71); color:#fff; }
        .scan-fab.scanning { background:linear-gradient(135deg, #d93025, #f06050) !important; animation:pulse-scan 1.5s infinite; }
        @keyframes pulse-scan { 0%,100%{ box-shadow:0 8px 28px rgba(217,48,37,0.4); } 50%{ box-shadow:0 8px 40px rgba(217,48,37,0.7),0 0 0 20px rgba(217,48,37,0.08); } }
        .scanner-modal { position:fixed; inset:0; z-index:9999; background:#000; display:none; flex-direction:column; align-items:center; justify-content:center; }
        .scanner-modal.active { display:flex; }
        .scanner-close { position:absolute; top:16px; right:16px; z-index:10002; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.25); border:none; color:#fff; font-size:22px; cursor:pointer; }
        #scanner-video { width:100%; height:100%; object-fit:cover; display:block; }
        .scanner-info { position:absolute; top:16px; left:16px; z-index:10002; background:rgba(0,0,0,0.6); color:#fff; font-size:12px; padding:6px 12px; border-radius:8px; display:flex; align-items:center; gap:8px; }
        .scanner-hint { position:absolute; bottom:100px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#ffcc00; font-size:14px; padding:10px 20px; border-radius:20px; z-index:10001; pointer-events:none; white-space:nowrap; font-weight:bold; }
        .scanner-overlay-frame { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:280px; height:280px; border:3px solid rgba(255,255,255,0.9); border-radius:20px; z-index:10000; pointer-events:none; box-shadow:0 0 0 2000px rgba(0,0,0,0.6); }
        .scanner-controls { position:absolute; bottom:180px; left:50%; transform:translateX(-50%); display:flex; gap:12px; z-index:10002; flex-wrap:wrap; justify-content:center; }
        .flash-btn, .focus-btn { width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.25); border:none; color:#fff; font-size:22px; cursor:pointer; display:none; align-items:center; justify-content:center; }
        .focus-slider-container { display:none; align-items:center; gap:8px; background:rgba(0,0,0,0.5); padding:6px 12px; border-radius:20px; }
        .focus-slider-container input[type=range] { width:100px; } .focus-slider-label { color:#fff; font-size:11px; }
        .result-toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:10003; padding:14px 24px; border-radius:25px; font-weight:600; font-size:13px; opacity:0; transition:0.35s; max-width:90vw; text-align:center; }
        .result-toast.show { opacity:1; top:28px; } .result-toast.success { background:#0d904f; color:#fff; } .result-toast.error { background:#d93025; color:#fff; } .result-toast.info { background:#1a73e8; color:#fff; }
        .table-container { overflow:auto; max-height:350px; border-radius:10px; border:1px solid var(--border); background:#fff; }
        .table-container table { border-collapse:collapse; min-width:700px; font-size:11px; } .table-container th, .table-container td { padding:8px 6px; border-bottom:1px solid #eee; text-align:center; } .table-container th { background:#f8f9fb; position:sticky; top:0; }
        .badge-pass { display:inline-block; padding:3px 10px; border-radius:12px; background:#0d904f; color:#fff; font-size:11px; }
        .log-list { list-style:none; max-height:200px; overflow-y:auto; font-size:11px; } .log-list li { padding:8px; border-bottom:1px solid #f0f0f0; display:flex; gap:8px; align-items:center; } .log-dot { width:8px; height:8px; border-radius:50%; } .log-dot.ok { background:var(--success); } .log-dot.fail { background:var(--danger); }
        .bottom-bar { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border); padding:10px 14px calc(10px + var(--safe-bottom)); display:flex; gap:8px; z-index:90; } .bottom-bar .btn { flex:1; }
    </style>
</head>
<body>
<header class="app-header"><div class="logo-area"><div class="logo-icon">📦</div><h1>配件盘点工具</h1></div></header>
<div class="main-content">
    <div class="card"><div class="card-header"><span class="card-title">📋 盘点表格</span><span style="font-size:11px;color:#666;" id="uploadStatus">请上传Excel</span></div><div class="upload-zone" id="uploadZone"><span>📁 点击上传 Excel 文件</span><input type="file" id="fileInput" accept=".xlsx,.xls"></div><div class="file-info" id="fileInfo" style="display:none;">✅ <span id="fileName"></span>（<span id="rowCount"></span>行）<button id="btnRemoveFile" style="margin-left:auto; background:none; border:none; color:red;">✕</button></div></div>
    <div class="stats-row"><div class="stat-item"><div class="stat-value total" id="statTotal">0</div><div style="font-size:11px;">总数</div></div><div class="stat-item"><div class="stat-value passed" id="statPassed">0</div><div style="font-size:11px;">通过</div></div><div class="stat-item"><div class="stat-value remaining" id="statRemaining">0</div><div style="font-size:11px;">待盘点</div></div></div>
    <div class="card"><div class="card-header"><span class="card-title">📷 二维码扫描</span></div><div class="scan-fab-container"><button class="scan-fab video-scan" id="btnScanFab" title="连续扫描（精准解码）">📹</button><button class="scan-fab photo-scan" id="btnPhotoScan" title="拍照扫描">📸</button></div><div style="text-align:center; font-size:12px; color:#666; margin:6px 0;" id="scanFabLabel">📹 连续 | 📸 拍照</div><div style="margin-top:8px;"><div style="font-size:11px;color:#666;">✍️ 手动输入</div><div style="display:flex; gap:8px;"><input type="text" id="manualQRInput" placeholder="粘贴二维码内容..." style="flex:1; border:1px solid #ccc; border-radius:20px; padding:10px;"><button class="btn btn-outline btn-sm" id="btnManualSubmit">确认</button></div></div></div>
    <div class="card"><div class="card-header"><span class="card-title">📝 表格预览</span></div><div class="table-container" id="tableContainer"><div style="padding:30px;text-align:center;color:#999;">暂无数据</div></div></div>
    <div class="card"><div class="card-header"><span class="card-title">📜 扫描日志</span><button class="btn btn-outline btn-sm" id="btnClearLog">清空</button></div><ul class="log-list" id="logList"><li style="color:#999;">暂无记录</li></ul></div>
</div>

<div class="scanner-modal" id="scannerModal">
    <button class="scanner-close" id="btnScannerClose">✕</button>
    <video id="scanner-video" autoplay playsinline muted></video>
    <div class="scanner-info" id="scannerInfo"><span id="resolutionLabel">--</span></div>
    <div class="scanner-overlay-frame"></div>
    <div class="scanner-hint" id="scannerHint">将二维码对准框内</div>
    <div id="focusTapArea" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:10001; background:transparent;"></div>
    <div class="scanner-controls">
        <button class="flash-btn" id="btnFlashToggle" title="闪光灯">🔦</button>
        <button class="focus-btn" id="btnAutoFocus" title="自动对焦">🎯</button>
        <div class="focus-slider-container" id="focusSliderContainer"><span class="focus-slider-label">焦距</span><input type="range" id="focusSlider" min="0" max="20" step="0.1" value="10"></div>
    </div>
</div>
<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;">
<div class="result-toast" id="resultToast"></div>

<div class="bottom-bar">
    <button class="btn btn-outline btn-sm" id="btnExport">💾 导出</button>
    <button class="btn btn-outline btn-sm" id="btnImport">📥 导入</button>
    <button class="btn btn-outline btn-sm" id="btnResetAll">🗑️ 重置</button>
</div>
<input type="file" id="importFileInput" accept=".json" style="display:none;">

<script>
    (() => {
        const AudioCtx = window.AudioContext || window.webkitAudioContext; let audioCtx;
        const beep = (f,d,t='sine') => { try{ if(!audioCtx) audioCtx=new AudioCtx(); if(audioCtx.state==='suspended') audioCtx.resume(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=t; o.frequency.value=f; g.gain.setValueAtTime(0.3,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d); }catch(e){} };
        const playOk = ()=>{ beep(880,0.12); setTimeout(()=>beep(1100,0.18),100); };
        const playErr = ()=> beep(280,0.25,'square');

        const STATE = {
            tableData:[], headers:[], fileName:'', totalRows:0, passedCount:0,
            scanLog:[], isScanning:false, currentScanResult:null,
            mediaStream:null, videoTrack:null, scanInterval:null, flashOn:false,
            brightnessTimer: null
        };
        const $=id=>document.getElementById(id);
        const dom = {
            fileInput:$('fileInput'), uploadZone:$('uploadZone'), uploadStatus:$('uploadStatus'),
            fileInfo:$('fileInfo'), fileName:$('fileName'), rowCount:$('rowCount'), btnRemoveFile:$('btnRemoveFile'),
            statTotal:$('statTotal'), statPassed:$('statPassed'), statRemaining:$('statRemaining'),
            btnScanFab:$('btnScanFab'), btnPhotoScan:$('btnPhotoScan'), scanFabLabel:$('scanFabLabel'),
            scannerModal:$('scannerModal'), btnScannerClose:$('btnScannerClose'), scannerHint:$('scannerHint'),
            scannerVideo:$('scanner-video'), manualQRInput:$('manualQRInput'), btnManualSubmit:$('btnManualSubmit'),
            tableContainer:$('tableContainer'), logList:$('logList'), btnClearLog:$('btnClearLog'),
            resultToast:$('resultToast'), btnExport:$('btnExport'), btnImport:$('btnImport'),
            btnResetAll:$('btnResetAll'), importFileInput:$('importFileInput'),
            focusTapArea:$('focusTapArea'), photoInput:$('photoInput'),
            btnFlashToggle:$('btnFlashToggle'), btnAutoFocus:$('btnAutoFocus'),
            focusSliderContainer:$('focusSliderContainer'), focusSlider:$('focusSlider'),
            resolutionLabel:$('resolutionLabel')
        };

        let toastTimer;
        const toast = (msg,type='info') => {
            const el=dom.resultToast; clearTimeout(toastTimer);
            el.className='result-toast '+type; el.textContent=msg;
            void el.offsetWidth; el.classList.add('show');
            toastTimer=setTimeout(()=>el.classList.remove('show'),2000);
        };
        const STORAGE_KEY = 'parts_final';
        const saveLocal = ()=>{ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ tableData:STATE.tableData, headers:STATE.headers, fileName:STATE.fileName, totalRows:STATE.totalRows, passedCount:STATE.passedCount, scanLog:STATE.scanLog.slice(-100) })); }catch(e){} };
        const loadLocal = ()=>{ try{ const d=JSON.parse(localStorage.getItem(STORAGE_KEY)); if(!d||!d.tableData) return false; STATE.tableData=d.tableData; STATE.headers=d.headers||[]; STATE.fileName=d.fileName||''; STATE.totalRows=d.totalRows||d.tableData.length; STATE.passedCount=d.passedCount||0; STATE.scanLog=d.scanLog||[]; recalcPassed(); return true; }catch(e){return false;} };
        const recalcPassed = ()=> STATE.passedCount = STATE.tableData.filter(r=>r.T==='通过').length;

        const indexToColLetter = i => { let s=''; let t=i; do{ s=String.fromCharCode(65+(t%26))+s; t=Math.floor(t/26)-1; }while(t>=0); return s; };
        const parseExcel = file => new Promise((resolve,reject)=>{
            const reader=new FileReader();
            reader.onload=e=>{ try{ const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}); const sheet=wb.Sheets[wb.SheetNames[0]]; const json=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''}); if(json.length<2) return reject(new Error('表头+至少一行数据')); const headers=json[0].map(h=>String(h||'').trim()); const rows=[]; for(let i=1;i<json.length;i++){ const rd=json[i]; if(!rd||rd.every(c=>c==='')) continue; const obj={}; headers.forEach((h,idx)=>{ const col=indexToColLetter(idx); obj[col]=String(rd[idx]||'').trim(); }); obj.T=obj.T||''; rows.push(obj); } resolve({headers,rows,fileName:file.name}); }catch(err){reject(err);} };
            reader.onerror=()=>reject(new Error('读取失败')); reader.readAsArrayBuffer(file);
        });

        // ====================== 核心优化：严格匹配你的数据规则 ======================
        const analyzeQR = (text) => {
            if(!text) return {success:false,error:'内容为空'};
            
            // 1. 移除所有空格
            const cleanText = text.replace(/\s+/g, '');
            // 2. 剔除固定前缀：84108（5位）
            const afterPrefix = cleanText.startsWith('84108') ? cleanText.slice(5) : cleanText;
            
            if(afterPrefix.length < 20) return {success:false,error:`有效内容过短，需≥20位`};
            
            // 3. 精准截取（严格按你的要求）
            const searchB = afterPrefix.substring(5, 12);   // 前缀后第6-12位 → B列
            const searchG = afterPrefix.substring(12, 19);  // 前缀后第13-19位 → G列
            const searchN = afterPrefix.substring(19);     // 前缀后第20位至末尾 → N列

            if(!searchB || !searchG || !searchN) return {success:false,error:'截取内容为空'};
            return { success:true, searchB, searchG, searchN, raw:text };
        };

        const processScan = (qrText) => {
            if(STATE.currentScanResult === qrText && STATE.isScanning) return;
            STATE.currentScanResult = qrText;

            const res = analyzeQR(qrText);
            if(!res.success){ toast(res.error,'error'); playErr(); addLog(qrText,false,res.error); resetScanLock(); return; }

            // 三项匹配：B/G/N 同时一致
            const match = STATE.tableData.find(row => 
                String(row.B || '').trim() === res.searchB &&
                String(row.G || '').trim() === res.searchG &&
                String(row.N || '').trim() === res.searchN
            );

            if(match){
                if(match.T !== '通过'){
                    match.T = '通过';
                    recalcPassed(); saveLocal(); updateStats(); renderTable();
                    toast('✅ 盘点通过','success'); playOk();
                    addLog(qrText,true,`B:${res.searchB} | G:${res.searchG} | N:${res.searchN}`);
                }else{
                    toast('ℹ️ 已盘点','info');
                }
            }else{
                toast('❌ 三项不匹配','error'); playErr();
                addLog(qrText,false,`匹配失败`);
            }
            
            resetScanLock();
        };
        // 连续扫描：快速解锁，支持极速连续识别
        const resetScanLock = () => {
            setTimeout(()=>{ STATE.currentScanResult = null; dom.scannerHint.textContent='将二维码对准框内'; }, 600);
        };
        // ========================================================================

        const addLog = (qr,ok,detail) => { 
            STATE.scanLog.unshift({time:new Date().toLocaleString('zh-CN'),qr:qr.length>30?qr.slice(0,30)+'...':qr,ok,detail});
            if(STATE.scanLog.length>80) STATE.scanLog.length=80; saveLocal(); renderLog(); 
        };
        const updateStats = ()=>{ dom.statTotal.textContent=STATE.totalRows; dom.statPassed.textContent=STATE.passedCount; dom.statRemaining.textContent=Math.max(0,STATE.totalRows-STATE.passedCount); };
        const renderTable = ()=>{ 
            if(!STATE.tableData.length){ dom.tableContainer.innerHTML='<div style="padding:30px;text-align:center;color:#999;">暂无数据</div>'; return; }
            let html='<table><thead><tr><th>#</th><th>B列</th><th>G列</th><th>N列</th><th>T列状态</th></tr></thead><tbody>';
            STATE.tableData.forEach((r,i)=>{
                html+=`<tr><td>${i+1}</td><td>${r.B||'-'}</td><td>${r.G||'-'}</td><td>${r.N||'-'}</td><td>${r.T==='通过'?'<span class="badge-pass">通过</span>':'待盘点'}</td></tr>`;
            });
            dom.tableContainer.innerHTML=html+'</tbody></table>';
        };
        const renderLog = ()=>{ dom.logList.innerHTML=STATE.scanLog.length?STATE.scanLog.map(l=>`<li><span class="log-dot ${l.ok?'ok':'fail'}"></span>${l.time} ${l.detail}</li>`).join(''):'<li style="color:#999;">暂无记录</li>'; };
        const updateUploadUI = ()=>{ 
            if(STATE.fileName){ dom.uploadZone.classList.add('has-file'); dom.fileInfo.style.display='flex'; dom.fileName.textContent=STATE.fileName; dom.rowCount.textContent=STATE.totalRows; }
            else{ dom.uploadZone.classList.remove('has-file'); dom.fileInfo.style.display='none'; }
        };
        const refreshUI = ()=>{ updateStats(); renderTable(); renderLog(); updateUploadUI(); };

        // 极速解码核心
        let barcodeDetector = null;
        try { if(BarcodeDetector) barcodeDetector = new BarcodeDetector({formats:['qr_code']}); } catch(e){}
        const decodeFrame = async (video) => {
            if(video.readyState<2) return null;
            const w=video.videoWidth,h=video.videoHeight,crop=Math.min(320,w,h);
            const canvas=document.createElement('canvas'); canvas.width=crop; canvas.height=crop;
            const ctx=canvas.getContext('2d'); ctx.drawImage(video,(w-crop)/2,(h-crop)/2,crop,crop,0,0,crop,crop);
            if(barcodeDetector){ try{ const codes=await barcodeDetector.detect(canvas); if(codes.length) return codes[0].rawValue; }catch(e){} }
            const img=ctx.getImageData(0,0,crop,crop); return jsQR(img.data,crop,crop)?.data||null;
        };

        // 连续扫描循环（120ms极速识别）
        const scanLoop = async (now) => {
            if(!STATE.isScanning) return;
            if(now - (STATE.lastScan||0) >= 120){
                STATE.lastScan = now;
                const code = await decodeFrame(dom.scannerVideo);
                if(code) processScan(code.trim());
            }
            STATE.scanInterval = requestAnimationFrame(scanLoop);
        };

        // 摄像头启动
        const startScan = async () => {
            if(!STATE.tableData.length){ toast('请先上传表格','error'); return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}}});
                STATE.mediaStream=stream; STATE.videoTrack=stream.getTracks()[0];
                dom.scannerVideo.srcObject=stream; await dom.scannerVideo.play();
                STATE.isScanning=true; dom.scannerModal.classList.add('active'); dom.btnScanFab.classList.add('scanning');
                requestAnimationFrame(scanLoop);
            }catch(e){ toast('摄像头开启失败','error'); }
        };

        // 停止扫描
        const stopScan = () => {
            STATE.isScanning=false; cancelAnimationFrame(STATE.scanInterval);
            if(STATE.mediaStream) STATE.mediaStream.getTracks().forEach(t=>t.stop());
            dom.scannerModal.classList.remove('active'); dom.btnScanFab.classList.remove('scanning');
            STATE.currentScanResult=null;
        };

        // 拍照扫描
        const photoScan = async (file) => {
            const img=new Image(); img.src=URL.createObjectURL(file);
            await new Promise(r=>img.onload=r);
            const canvas=document.createElement('canvas'); canvas.width=img.width; canvas.height=img.height;
            canvas.getContext('2d').drawImage(img,0,0);
            const code = barcodeDetector ? (await barcodeDetector.detect(canvas))[0]?.rawValue : jsQR(canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height)?.data;
            if(code) processScan(code); else toast('未识别到二维码','error');
        };

        // 事件绑定
        const bind = () => {
            dom.fileInput.onchange=async e=>{const f=e.target.files[0];if(!f)return;const d=await parseExcel(f);STATE.tableData=d.rows;STATE.headers=d.headers;STATE.fileName=d.fileName;STATE.totalRows=d.rows.length;STATE.passedCount=0;STATE.scanLog=[];saveLocal();refreshUI();toast(`加载 ${d.rows.length} 行数据`,'success');};
            dom.btnScanFab.onclick=()=>STATE.isScanning?stopScan():startScan();
            dom.btnScannerClose.onclick=stopScan;
            dom.btnPhotoScan.onclick=()=>dom.photoInput.click();
            dom.photoInput.onchange=e=>e.target.files[0]&&photoScan(e.target.files[0]);
            dom.btnManualSubmit.onclick=()=>{const v=dom.manualQRInput.value.trim();v&&processScan(v);dom.manualQRInput.value='';};
            dom.btnClearLog.onclick=()=>{STATE.scanLog=[];saveLocal();renderLog();};
            dom.btnResetAll.onclick=()=>{if(!confirm('确定重置？'))return;localStorage.clear();location.reload();};
            dom.btnRemoveFile.onclick=()=>{STATE.tableData=[];localStorage.clear();refreshUI();};
        };

        // 初始化
        loadLocal() && refreshUI();
        bind();
    })();
</script>
</body>
</html>
